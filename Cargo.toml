[package]
name = "berth"
version = "0.1.0"
edition = "2021"
description = "Personal CLI package manager for standalone executables"
license = "MIT"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
colored = "2.2.0"
flate2 = "1.1.11"
hex = "0.4.3"
indicatif = "0.17.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
toml = "1.2.3"
ureq = "3.5.2"
xz2 = { version = "0.1.7", features = ["static"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.27.0"
